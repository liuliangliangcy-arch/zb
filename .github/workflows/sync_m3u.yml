name: Auto Sync IPTV

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-notify:
    runs-on: ubuntu-latest

    env:
      MAIN_SOURCE_ENABLED: "on"
      CCTV_SOURCE_ENABLED: "on"
      JINJIANG_ENABLED: "on"
      WECHAT_ENABLED: "on"

      MAIN_URL: "https://raw.githubusercontent.com/ioptu/migu_video/main/migu.m3u"
      CCTV_URL: "https://raw.githubusercontent.com/ioptu/migu_video/main/cctv.migu.m3u"
      JINJIANG_URL: "https://raw.githubusercontent.com/2383534802/ds/main/jinjinag"

      OUTPUT_FILE: "iptv-fe.m3u"
      GROUP_NAME: "央视直播"
      EXPIRE_TIME: "2027-12-01 00:00:00"

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check old file
        id: old
        shell: bash
        run: |
          if [ -f "$OUTPUT_FILE" ]; then
            OLD_HASH=$(sha256sum "$OUTPUT_FILE" | awk '{print $1}')
            echo "old_hash=$OLD_HASH" >> "$GITHUB_OUTPUT"
          else
            echo "old_hash=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Download sources
        id: download
        shell: bash
        run: |
          set -u

          : > main.m3u
          : > cctv.m3u
          : > jinjiang.m3u

          if [ "$MAIN_SOURCE_ENABLED" = "on" ]; then
            curl -fL --retry 3 --connect-timeout 20 --max-time 120 \
              "$MAIN_URL" -o main.m3u
          fi

          if [ "$CCTV_SOURCE_ENABLED" = "on" ]; then
            curl -fL --retry 3 --connect-timeout 20 --max-time 120 \
              "$CCTV_URL" -o cctv.m3u
          fi

          if [ "$JINJIANG_ENABLED" = "on" ]; then
            curl -fL --retry 3 --connect-timeout 20 --max-time 120 \
              "$JINJIANG_URL" -o jinjiang.m3u
          fi

          MAIN_COUNT=$(grep -c '^#EXTINF' main.m3u || true)
          CCTV_COUNT=$(grep -c '^#EXTINF' cctv.m3u || true)
          JINJIANG_COUNT=$(grep -c '^#EXTINF' jinjiang.m3u || true)

          echo "main_count=$MAIN_COUNT" >> "$GITHUB_OUTPUT"
          echo "cctv_count=$CCTV_COUNT" >> "$GITHUB_OUTPUT"
          echo "jinjiang_count=$JINJIANG_COUNT" >> "$GITHUB_OUTPUT"

          echo "主源：$MAIN_COUNT"
          echo "CCTV：$CCTV_COUNT"
          echo "锦江：$JINJIANG_COUNT"

      - name: Fix and merge
        id: merge
        shell: bash
        run: |
          echo "#EXTM3U" > new-iptv.m3u

          if [ "$MAIN_SOURCE_ENABLED" = "on" ] && [ -s main.m3u ]; then
            grep -v '^#EXTM3U' main.m3u >> new-iptv.m3u || true
          fi

          if [ "$CCTV_SOURCE_ENABLED" = "on" ] && [ -s cctv.m3u ]; then
            sed -E 's/(tvg-logo="[^"]*")/\1,group-title="央视专版"/' cctv.m3u \
              | grep -v '^#EXTM3U' >> new-iptv.m3u || true
          fi

          if [ "$JINJIANG_ENABLED" = "on" ] && [ -s jinjiang.m3u ]; then
            grep -v '^#EXTM3U' jinjiang.m3u >> new-iptv.m3u || true
          fi

          CHANNEL_COUNT=$(grep -c '^#EXTINF' new-iptv.m3u || true)

          if [ "$CHANNEL_COUNT" -le 0 ]; then
            echo "错误：合并后没有有效频道"
            exit 1
          fi

          echo "channel_count=$CHANNEL_COUNT" >> "$GITHUB_OUTPUT"
          echo "合并后频道数：$CHANNEL_COUNT"

      - name: Compare
        id: compare
        shell: bash
        run: |
          NEW_HASH=$(sha256sum new-iptv.m3u | awk '{print $1}')
          OLD_HASH="${{ steps.old.outputs.old_hash }}"

          echo "new_hash=$NEW_HASH" >> "$GITHUB_OUTPUT"

          if [ "$OLD_HASH" = "$NEW_HASH" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "文件没有变化"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "文件有变化"
          fi

      - name: Update and push
        if: steps.compare.outputs.changed == 'true'
        shell: bash
        run: |
          mv new-iptv.m3u "$OUTPUT_FILE"

          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git add "$OUTPUT_FILE"
          git commit -m "自动同步 IPTV 直播源"
          git push origin main

      - name: Enterprise WeChat notification
        if: always() && env.WECHAT_ENABLED == 'on'
        continue-on-error: true
        shell: bash
        env:
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
        run: |
          if [ -z "$WECHAT_WEBHOOK" ]; then
            echo "未配置 WECHAT_WEBHOOK"
            exit 0
          fi

          RUN_TIME=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')
          JOB_STATUS="${{ job.status }}"
          CHANGED="${{ steps.compare.outputs.changed }}"
          MAIN_COUNT="${{ steps.download.outputs.main_count }}"
          CCTV_COUNT="${{ steps.download.outputs.cctv_count }}"
          JINJIANG_COUNT="${{ steps.download.outputs.jinjiang_count }}"
          CHANNEL_COUNT="${{ steps.merge.outputs.channel_count }}"
          NEW_HASH="${{ steps.compare.outputs.new_hash }}"

          if [ "$JOB_STATUS" = "success" ]; then
            STATUS="成功"
          else
            STATUS="失败"
          fi

          if [ "$CHANGED" = "true" ]; then
            CHANGE="有变化，已更新 iptv-fe.m3u"
          elif [ "$CHANGED" = "false" ]; then
            CHANGE="无变化，未提交"
          else
            CHANGE="任务未完成"
          fi

          export RUN_TIME STATUS CHANGE MAIN_COUNT CCTV_COUNT JINJIANG_COUNT CHANNEL_COUNT NEW_HASH

          python3 <<'PY'
          import json
          import os
          import urllib.request

          webhook = os.environ["WECHAT_WEBHOOK"]

          content = f"""📡 IPTV 自动同步任务

          执行时间：{os.environ.get("RUN_TIME", "")}
          运行状态：{os.environ.get("STATUS", "")}
          变更状态：{os.environ.get("CHANGE", "")}

          主源频道：{os.environ.get("MAIN_COUNT", "0")}
          CCTV频道：{os.environ.get("CCTV_COUNT", "0")}
          锦江频道：{os.environ.get("JINJIANG_COUNT", "0")}
          合计频道：{os.environ.get("CHANNEL_COUNT", "0")}

          同步周期：每15分钟
          到期时间：2027-12-01 00:00:00

          文件：iptv-fe.m3u

          SHA256：
          {os.environ.get("NEW_HASH", "")}
          """

          data = {
              "msgtype": "text",
              "text": {
                  "content": content
              }
          }

          if os.environ.get("STATUS") == "失败":
              data["text"]["mentioned_list"] = ["@all"]

          request = urllib.request.Request(
              webhook,
              data=json.dumps(
                  data,
                  ensure_ascii=False
              ).encode("utf-8"),
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(
              request,
              timeout=20
          ) as response:
              print(
                  response.read().decode(
                      "utf-8",
                      errors="ignore"
                  )
              )
          PY

      - name: No changes log
        if: steps.compare.outputs.changed == 'false'
        shell: bash
        run: |
          echo "⏭️ $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S') 文件没有变化"
